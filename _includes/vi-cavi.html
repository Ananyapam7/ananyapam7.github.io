<figure class="vi-cavi" data-cavi="" id="cavi-explorer">
<h5>One factor moves. The ELBO climbs.</h5>
<p>Blue contours are the target. Orange contours are the current product approximation. The marginal plots show each factor in orange and its true target marginal in dashed blue. Each button press performs one exact factor update.</p>
<div class="vi-cavi-live" hidden="">
<div class="vi-cavi-controls">
<label>Target correlation ρ <output data-rho-label="">0.80</output><input data-cavi-rho="" max="0.95" min="0" step="0.05" type="range" value="0.8"/></label>
<button data-cavi-step="" type="button">Update q₁</button>
<button data-cavi-play="" type="button">Play updates</button>
<button data-cavi-reset="" type="button">Reset</button>
</div>
<p aria-live="polite" class="vi-cavi-status" data-cavi-status="" role="status">Start with q₁; q₂ stays fixed.</p>
<div class="vi-cavi-panels">
<svg aria-label="Target and mean-field approximation contours, with a path marking the changing mean" data-cavi-joint="" role="img" viewbox="0 0 420 320"></svg>
<div class="vi-cavi-marginals">
<svg aria-label="First variational factor" data-cavi-factor="0" role="img" viewbox="0 0 360 160"></svg>
<svg aria-label="Second variational factor" data-cavi-factor="1" role="img" viewbox="0 0 360 160"></svg>
</div>
</div>
<svg aria-label="ELBO at each completed factor update, with the best mean-field ELBO and log Z marked" data-cavi-elbo="" role="img" viewbox="0 0 760 210"></svg>
<p class="vi-cavi-values" data-cavi-values=""></p>
</div>
<div data-cavi-fallback=""><img alt="Correlated Gaussian target and best mean-field fit" src="/assets/vi/mfvi-geometry.svg"/><p>Enable JavaScript to step through the factor updates.</p></div>
<figcaption>Here \(\gamma=\pi\), so \(\log Z=0\) and the ELBO is exactly minus KL. The dashed orange level is the best ELBO in this mean-field family: \(\tfrac12\log(1-\rho^2)\). A remaining gap to zero is approximation error, not unfinished optimization. Contours mark equal Mahalanobis radii; their colors distinguish the two distributions.</figcaption>
</figure>
